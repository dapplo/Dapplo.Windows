name: Build

# Pull requests and pushes to other branches build, test, pack and build the docs.
# A push to master (a merged PR) additionally releases: after your approval of the "NuGet" environment it publishes
# the NuGet packages, creates the tag and GitHub release, and publishes gh-pages and the wiki.
on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches-ignore:
      - 'gh-pages'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SOLUTION: 'src/Dapplo.Windows.sln'
  BUILD_PLATFORM: 'Any CPU'
  BUILD_CONFIGURATION: 'Release'
  DOCFX_VERSION: '2.81.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Nerdbank.GitVersioning needs the history to calculate the version

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore $env:SOLUTION

    - name: Build
      run: dotnet build $env:SOLUTION --configuration $env:BUILD_CONFIGURATION "/p:Platform=$env:BUILD_PLATFORM" --no-restore

    # Tests that drive the real desktop are tagged Interactive and excluded.
    # Coverage is only collected on .NET 10: coverlet.msbuild 8 injects a tracker that references System.Runtime 8.0,
    # which doesn't exist on .NET Framework, so every instrumented call would fail there.
    - name: Test (net10.0-windows, with coverage)
      run: >
        dotnet test src/Dapplo.Windows.Tests/Dapplo.Windows.Tests.csproj --configuration $env:BUILD_CONFIGURATION
        --framework net10.0-windows --no-build --filter "Category!=Interactive"
        --logger "trx;LogFilePrefix=Dapplo.Windows.Tests" --results-directory "$env:GITHUB_WORKSPACE/TestResults"
        /p:CollectCoverage=true /p:CoverletOutputFormat=lcov "/p:CoverletOutput=$env:GITHUB_WORKSPACE/TestResults/coverage/"

    - name: Test (net480)
      if: success() || failure()
      run: >
        dotnet test src/Dapplo.Windows.Tests/Dapplo.Windows.Tests.csproj --configuration $env:BUILD_CONFIGURATION
        --framework net480 --no-build --filter "Category!=Interactive"
        --logger "trx;LogFilePrefix=Dapplo.Windows.Tests" --results-directory "$env:GITHUB_WORKSPACE/TestResults"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        retention-days: 7
        if-no-files-found: warn
        path: |
          TestResults/**/*.trx
          TestResults/coverage/*.info

    - name: Find coverage files
      id: coverage
      if: always()
      env:
        HAS_COVERALLS_TOKEN: ${{ secrets.COVERALLS_SECRET != '' }}
      run: |
        $files = @(Get-ChildItem -Path TestResults/coverage -Filter *.info -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
        $enabled = ($env:HAS_COVERALLS_TOKEN -eq 'true') -and ($files.Count -gt 0)
        if ($env:HAS_COVERALLS_TOKEN -ne 'true') { Write-Host "COVERALLS_SECRET is not configured, skipping the coverage upload." }
        if ($files.Count -eq 0) { Write-Host "No coverage files found, skipping the coverage upload." }
        "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "files=$($files -join ' ')" >> $env:GITHUB_OUTPUT

    - name: Upload coverage to Coveralls
      if: always() && steps.coverage.outputs.enabled == 'true'
      continue-on-error: true
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.COVERALLS_SECRET }}
        fail-on-error: false
        format: lcov
        files: ${{ steps.coverage.outputs.files }}

    - name: Collect NuGet packages
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        $packages = @(Get-ChildItem -Path src -Recurse -File -Include *.nupkg, *.snupkg |
          Where-Object { $_.FullName -match "\\bin\\$env:BUILD_CONFIGURATION\\" })
        if ($packages.Count -eq 0) { throw "No NuGet packages were produced by the build." }
        $packages | Copy-Item -Destination artifacts
        $packages | ForEach-Object { Write-Host $_.Name }

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        retention-days: 7
        if-no-files-found: error
        path: artifacts/

  docs:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Nerdbank.GitVersioning runs while docfx loads the projects

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore $env:SOLUTION

    - name: Install docfx
      run: |
        dotnet tool install --global docfx --version $env:DOCFX_VERSION
        if ($LASTEXITCODE -ne 0) { throw "Installing docfx failed" }
        Join-Path $env:USERPROFILE '.dotnet\tools' >> $env:GITHUB_PATH

    - name: Generate API metadata
      run: |
        docfx metadata doc/docfx.json
        if ($LASTEXITCODE -ne 0) { throw "docfx metadata failed with exit code $LASTEXITCODE" }
        # Guard against an "empty" API reference (the old docfx produced none without failing).
        if (-not (Test-Path doc/api/toc.yml)) { throw "docfx did not generate doc/api/toc.yml" }
        $pages = @(Get-ChildItem -Path doc/api -Filter *.yml -File | Where-Object { $_.Name -ne 'toc.yml' })
        Write-Host "Generated $($pages.Count) API pages."
        if ($pages.Count -eq 0) { throw "docfx generated no API pages" }
        $unwanted = @($pages | Where-Object { $_.Name -like 'Dapplo.Windows.Tests*' -or $_.Name -like 'Dapplo.Windows.Example*' })
        if ($unwanted.Count -gt 0) { throw "API reference contains test or example types: $($unwanted.Name -join ', ')" }

    - name: Build documentation
      run: |
        docfx build doc/docfx.json
        if ($LASTEXITCODE -ne 0) { throw "docfx build failed with exit code $LASTEXITCODE" }

    - name: Upload documentation site
      uses: actions/upload-artifact@v7
      with:
        name: documentation-site
        retention-days: 7
        if-no-files-found: error
        path: doc/_site/

  release:
    # Every push to master (a merged PR) builds a public release version (see src/version.json).
    # The job uses the "NuGet" environment: with required reviewers configured on it (Settings > Environments > NuGet),
    # GitHub waits for your approval before anything is published.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    environment:
      name: NuGet
    permissions:
      contents: write  # tag + GitHub release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Determine the version
      id: version
      run: |
        $common = @(Get-ChildItem -Path artifacts -Filter 'Dapplo.Windows.Common.*.nupkg' -File)
        if ($common.Count -ne 1) { throw "Expected exactly one Dapplo.Windows.Common package, found $($common.Count)" }
        $version = $common[0].Name.Substring('Dapplo.Windows.Common.'.Length) -replace '\.nupkg$', ''
        if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Package version '$version' is not a public release version; check publicReleaseRefSpec in src/version.json." }
        $wrong = @(Get-ChildItem -Path artifacts -Filter *.nupkg -File | Where-Object { -not $_.Name.EndsWith(".$version.nupkg") })
        if ($wrong.Count -gt 0) { throw "Packages with a different version: $($wrong.Name -join ', ')" }
        # Never re-use a version for different code: stop when its tag already exists on another commit
        git fetch --quiet --tags origin
        if ($LASTEXITCODE -ne 0) { throw "Fetching the tags failed" }
        # rev-parse exits with 1 when the tag doesn't exist, which is the normal case
        $tagCommit = git rev-parse --verify --quiet "refs/tags/v$version^{commit}"
        if ($tagCommit -and $tagCommit -ne $env:GITHUB_SHA) {
          throw "Version $version was already released from commit $tagCommit. Raise the version in src/version.json."
        }
        # The step's exit code is the last native command's exit code, reset it
        $global:LASTEXITCODE = 0
        Write-Host "Releasing version $version"
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Release notes from CHANGELOG.md
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # The patch number comes from the git height, so it isn't known when the changelog is written. Uses, in this order:
        #   "## [<version>]" (e.g. 3.2.4), "## [Unreleased]", and for the first release of a minor version the section
        #   of that minor version ("## [3.2.0]" or "## [3.2]"). Without any of them, GitHub generates notes from the merged PRs.
        $lines = Get-Content -Path CHANGELOG.md -Encoding utf8
        function Get-Section([string]$pattern) {
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $pattern) { $start = $i; break } }
          if ($start -lt 0) { return '' }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ' -or $lines[$i] -match '^\[[^\]]+\]:\s') { $end = $i; break } }
          if ($end -le $start + 1) { return '' }
          return ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
        }
        $notes = Get-Section ('^## \[?' + [regex]::Escape($env:VERSION) + '(\]|\s|$)')
        if (-not $notes) { $notes = Get-Section '^## \[?Unreleased(\]|\s|$)' }
        if (-not $notes) {
          $minor = ($env:VERSION -split '\.')[0..1] -join '.'
          # The version step fetched the tags; a tag of this minor version means this isn't its first release
          $released = @(git tag --list "v$minor.*")
          $global:LASTEXITCODE = 0
          if ($released.Count -eq 0) {
            $notes = Get-Section ('^## \[?' + [regex]::Escape($minor) + '(\.0)?(\]|\s|$)')
          }
        }
        $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
        Set-Content -Path $notesFile -Value $notes -Encoding utf8NoBOM
        if ($notes) { Get-Content $notesFile } else { Write-Host "No changelog section found, GitHub will generate the notes." }

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ([string]::IsNullOrEmpty($env:NUGET_API_KEY)) { throw "The NUGET_API_KEY secret is not configured." }
        # dotnet nuget push also pushes the .snupkg next to each .nupkg; --skip-duplicate makes re-runs safe
        foreach ($package in Get-ChildItem -Path artifacts -Filter *.nupkg -File) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Failed to push $($package.Name)" }
        }

    - name: Create tag and GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $tag = "v$env:VERSION"
        $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
        $notesArgs = if ((Get-Item $notesFile).Length -gt 0) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
        $assets = @(Get-ChildItem -Path artifacts -File -Include *.nupkg, *.snupkg -Recurse | ForEach-Object { $_.FullName })
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          # Re-run of the job: update the existing release
          gh release upload $tag @assets --clobber
        } else {
          # Creates the tag on the released commit
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Dapplo.Windows $env:VERSION" @notesArgs
        }
        if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub release failed" }

  # The documentation site and the wiki describe the released API, so they are published after the release was approved.
  publish-docs:
    needs: [docs, release]
    runs-on: windows-latest
    concurrency:
      group: publish-docs
      cancel-in-progress: false
    permissions:
      contents: write  # push to gh-pages
    steps:
    - name: Download documentation site
      uses: actions/download-artifact@v8
      with:
        name: documentation-site
        path: ${{ runner.temp }}/site

    - name: Publish documentation to gh-pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $site = Join-Path $env:RUNNER_TEMP 'site'
        if (-not (Test-Path (Join-Path $site 'index.html'))) { throw "The documentation site has no index.html" }
        New-Item -ItemType File -Force -Path (Join-Path $site '.nojekyll') | Out-Null
        Set-Location $site
        git init -q -b gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config core.autocrlf false
        git add -A
        git commit -q -m "Documentation for ${{ needs.release.outputs.version }} ($env:GITHUB_SHA)"
        # The gh-pages branch holds only the generated site, so it is replaced as a whole.
        git push -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:gh-pages

  publish-wiki:
    needs: release
    runs-on: windows-latest
    concurrency:
      group: publish-wiki
      cancel-in-progress: false
    permissions:
      contents: write  # push to the wiki repository
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Publish wiki/ to the GitHub wiki
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $wikiUrl = "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.wiki.git"
        $wikiDir = Join-Path $env:RUNNER_TEMP 'wiki'

        # Clone without line-ending conversion: the Windows runner has core.autocrlf=true, which makes every page look modified
        git -c core.autocrlf=false clone --quiet --depth 1 $wikiUrl $wikiDir
        if ($LASTEXITCODE -ne 0) {
          # GitHub creates the wiki repository only when the first page is saved in the web UI; it can't be created by a push.
          Write-Host "::error title=Wiki not available::Could not clone $env:GITHUB_REPOSITORY.wiki.git. Enable the wiki and create the first page in the GitHub web UI, then re-run this job."
          exit 1
        }
        $PSNativeCommandUseErrorActionPreference = $true

        git -C $wikiDir config user.name "github-actions[bot]"
        git -C $wikiDir config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C $wikiDir config core.autocrlf false

        # Mirror wiki/: delete every page first (git add -A records the deletions), so deleted or renamed pages disappear from the wiki.
        Get-ChildItem -Path $wikiDir -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
        Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'wiki/*') -Destination $wikiDir -Recurse -Force
        git -C $wikiDir add -A

        $status = git -C $wikiDir status --porcelain
        if ($status) {
          git -C $wikiDir commit -q -m "Update wiki for ${{ needs.release.outputs.version }} ($env:GITHUB_SHA)"
          git -C $wikiDir push origin HEAD
        } else {
          Write-Host "No wiki changes to publish."
        }
